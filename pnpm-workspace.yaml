packages:
  - "apps/*"
  - "packages/*"

# Node 26 is the one supported line (.node-version, mise.toml, engines):
# installing on any other Node fails instead of half-working.
engineStrict: true

# Vetted 2026-10-24: @google/genai preinstall is a literal no-op echo; protobufjs
# postinstall is non-essential. Never flip one of these to true without reading
# the script first.
allowBuilds:
  "@google/genai": false
  protobufjs: false
  "@mongodb-js/zstd": false
  node-liblzma: false
# Every dependency shared by two or more workspaces (or locked to a sibling's
# version) resolves here, so one edit moves them all. The @earendil-works set
# (pi-schema included: chord's schema language) ships in lockstep -- bump together.
catalog:
  ws: ^8.22.1
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
  effect: ^4.1.2
  croner: ^11.0.0
  "@earendil-works/chord": 1.5.0
  "@earendil-works/pi-ai": 1.5.0
  "@earendil-works/pi-codemode": 1.5.0
  "@earendil-works/pi-durable": 1.5.0
  "@earendil-works/pi-schema": 1.5.0
  "@modelcontextprotocol/client": ^2.4.0
  "@modelcontextprotocol/server": ^2.4.0
  # Mermaid to SVG (MIT, zero dependencies): the graph tool renders server-side,
  # the web draws chat diagrams. Exact: 1.13.0 is the version tested.
  pele: 1.13.0
  # The web app and the terminal client (@opentui/react renders React 19).
  react: ^19.3.1
  "@types/react": ^19.3.0
  # The terminal UI (apps/cli). 0.x, Node build since 0.8: exact, bump on purpose.
  "@opentui/core": 0.8.2
  "@opentui/react": 0.8.2
overrides:
  vite@*: "catalog:"
  # GHSA-rj75-hqrm-r3gf (moderate): patch bump within v6, build-time only
  # (apps/web > @tailwindcss/typography). Drop when typography bumps it.
  postcss-selector-parser@6: ^6.1.5
  # GHSA-g3hv-75wg-m249 (moderate): minimatch <11.0.1, dev-only
  # (apps/web > shadcn > ts-morph > @ts-morph/common, which still asks ^10).
  # Drop when @ts-morph/common moves to minimatch 11.
  minimatch@10: ^11.0.1
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
    # chord 1.5.0 pins its optional ws peer exactly (8.21.0); any ws 8 serves it.
    "@earendil-works/chord>ws": ^8.21.0
