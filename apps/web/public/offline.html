<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Ultiv is offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font:
          16px/1.5 system-ui,
          sans-serif;
        background: #f5f4f0;
        color: #24252d;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0d0e14;
          color: #ece7de;
        }
      }
      main {
        max-width: 22rem;
        padding: 1.5rem;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      button {
        min-height: 44px;
        padding: 0 1.25rem;
        font: inherit;
        border-radius: 999px;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Ultiv can't reach your server right now. Check your network or tailnet, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
